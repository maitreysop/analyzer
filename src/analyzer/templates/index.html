<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Analyser</title>
  <style>
    :root {
      --bg: #101418; --panel: #1a2028; --border: #2c3540;
      --text: #e6edf3; --muted: #8b98a5; --accent: #ff8205; --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1rem;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    main { max-width: 720px; margin: 0 auto; display: grid; gap: 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    h1 code { color: var(--accent); }
    p.hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
    textarea {
      width: 100%; min-height: 10rem; padding: 0.75rem;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem;
      resize: vertical;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    button {
      padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); color: var(--text); cursor: pointer; font-size: 0.9rem;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: wait; }
    label { display: flex; align-items: center; gap: 0.4rem; color: var(--muted); font-size: 0.85rem; }
    #status { font-size: 0.85rem; }
    #status.error { color: var(--error); white-space: pre-wrap; }
    #status.ok { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    td.num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .heaviest td { background: rgba(255, 130, 5, 0.12); }
    code { background: var(--panel); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
  </style>
</head>
<body>
<main>
  <h1>📦 <code>analyzer</code></h1>
  <p class="hint">Paste a JSON array of <code>{'name': ..., 'weight': ...}</code> objects.
    Weights may be numbers or numeric strings. Results come from the
    <code>/api/sort</code> and <code>/api/heaviest</code> endpoints.</p>

  <textarea id="input" spellcheck="false">[
  {"name": "apple", "weight": "150"},
  {"name": "grape", "weight": "5"},
  {"name": "melon", "weight": "1200.5"},
  {"name": "pumpkin", "weight": 1200.5}
]</textarea>

  <div class="controls">
    <button id="btn-sort" data-action="sort" onclick="callApi('sort')">Sort by weight</button>
    <button id="btn-heaviest" data-action="heaviest" onclick="callApi('heaviest')">Show heaviest</button>
    <label><input type="checkbox" id="reverse"> descending</label>
    <span id="status"></span>
  </div>

  <div id="result"></div>
</main>

<script>
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const buttons = [...document.querySelectorAll('button[data-action]')];
  const API_BASE = '/api';

  let actionWas = null;

  async function callApi(action) {
    let items;
    try {
      items = JSON.parse(document.getElementById('input').value);
    } catch (e) {
      setResult(null, `Invalid JSON in the input box: ${e.message}`);
      return;
    }
    const body = { items };
    if (action === 'sort' && document.getElementById('reverse').checked) {
      body.reverse = true;
    }
    buttons.forEach(b => (b.disabled = true));
    setStatus('Working…', '');
    // The API returns `{"sorted": [...]}` for the 'sort' action but
    // `{"heaviest": [...]}` for 'heaviest' — map each action to its key.
    const responseKey = action === 'sort' ? 'sorted' : 'heaviest';
    try {
      const res = await fetch(`${API_BASE}/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      const items = res.ok ? data[responseKey] : null;
      if (!Array.isArray(items)) {
        setResult(null, data.error || `Request failed (HTTP ${res.status})`);
      } else {
        actionWas = action;
        render(items);
      }
    } catch (e) {
      setResult(null, `Could not reach the server: ${e.message}`);
    } finally {
      buttons.forEach(b => (b.disabled = false));
    }
  }

  function render(items) {
    const highlight = actionWas === 'heaviest'
      ? new Set(items.map(i => JSON.stringify(i)))
      : null;
    const rows = items.map(item => `
      <tr class="${highlight && highlight.has(JSON.stringify(item)) ? 'heaviest' : ''}">
        <td>${highlight && highlight.has(JSON.stringify(item)) ? '★' : ''}</td>
        <td>${escapeHtml(String(item.name ?? ''))}</td>
        <td class="num">${escapeHtml(String(item.weight))}</td>
      </tr>`).join('');
    resultEl.innerHTML = `
      <table>
        <thead><tr><th></th><th>Name</th><th>Weight</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    setResult(items, `${items.length} item${items.length === 1 ? '' : 's'}`);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function setResult(items, message) {
    if (!items) resultEl.innerHTML = '';
    setStatus(message, items ? 'ok' : 'error');
  }
  function setStatus(message, cls) {
    statusEl.textContent = message;
    statusEl.className = cls || '';
  }

  buttons.forEach(b => b.addEventListener('click', () => callApi(b.dataset.action)));
</script>
</body>
</html>
