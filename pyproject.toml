[project]
name = "sample-analyser"
version = "0.1.0"
description = "Utilities for sorting and analysing weighted items."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "msoparia" },
]
dependencies = [
    "flask>=3.1.3",
]

# The project is pure standard library today: add runtime deps here, e.g.
# dependencies = ["requests>=2.32"]

[project.scripts]
sample-analyser = "sample_analyser:main"
sample-analyser-web = "sample_analyser.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_analyser"]
